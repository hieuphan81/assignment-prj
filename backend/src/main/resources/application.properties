spring.application.name=math10ai-backend
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Math10AI;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.mode=never
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
math10.ai.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
math10.ai.key=${AI_API_KEY:AQ.Ab8RN6JvUyTmrZIRROqAHOqgta_I14ewJ-nxsHQRzbW-7hPo6Q}
math10.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
math10.ai.hint-limit=${AI_HINT_LIMIT:3}
math10.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
math10.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
math10.bootstrap.name=${BOOTSTRAP_ADMIN_NAME:Quản trị hệ thống}
math10.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:admin@math10.local}
math10.upload-dir=${MATH10_UPLOAD_DIR:./private-uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.jsp.init-parameters.development=true

